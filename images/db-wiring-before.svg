<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWarn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1515"/>
      <stop offset="100%" stop-color="#180e0e"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
  </defs>
  <!-- Background Enclosure -->
  <rect width="400" height="240" rx="10" fill="url(#bgWarn)"/>
  <rect x="20" y="20" width="360" height="200" rx="8" fill="#1a202c" stroke="#e53e3e" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- Charred / Burnt Breaker Unit -->
  <rect x="60" y="55" width="280" height="80" rx="6" fill="url(#metal)" stroke="#4a5568" stroke-width="2"/>
  <rect x="140" y="70" width="45" height="50" rx="4" fill="#000" opacity="0.8"/>
  <rect x="195" y="70" width="45" height="50" rx="4" fill="#742a2a"/>
  
  <!-- Burn Marks & Smoke -->
  <circle cx="217" cy="85" r="22" fill="#e53e3e" opacity="0.35"/>
  <circle cx="217" cy="85" r="12" fill="#000" opacity="0.7"/>
  <path d="M 215 65 Q 225 40 210 25 Q 230 15 220 5" stroke="#a0aec0" stroke-width="3" fill="none" opacity="0.5"/>
  
  <!-- Tangled Loose Wires -->
  <path d="M 40 40 C 90 90, 80 160, 150 110 C 180 80, 200 170, 260 120" stroke="#e53e3e" stroke-width="4" fill="none"/>
  <path d="M 50 180 C 100 120, 130 180, 180 140 C 220 100, 290 190, 350 130" stroke="#ecc94b" stroke-width="3.5" fill="none"/>
  <path d="M 70 30 C 120 100, 160 30, 220 90 C 250 140, 310 70, 360 150" stroke="#3182ce" stroke-width="3.5" fill="none"/>
  <path d="M 90 200 C 140 140, 220 210, 280 160 C 310 130, 340 170, 370 160" stroke="#718096" stroke-width="4" fill="none"/>
  
  <!-- Spark Hazard Icon -->
  <polygon points="217,45 227,65 219,65 229,90 211,70 219,70" fill="#f6e05e" stroke="#dd6b20" stroke-width="1.5"/>
  
  <!-- Status Badge -->
  <rect x="25" y="25" width="130" height="24" rx="4" fill="#9b2c2c"/>
  <text x="90" y="41" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🔴 BURNT BREAKER</text>
  <text x="200" y="210" fill="#fc8181" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Hazardous Tangled Wiring • Sparking Risk</text>
</svg>
