<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26231d"/>
      <stop offset="100%" stop-color="#14120e"/>
    </linearGradient>
    <radialGradient id="waterStain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#2d3748" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a202c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rustPipe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#92400e"/>
      <stop offset="70%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
  </defs>

  <!-- Wall Background & Dampness -->
  <rect width="400" height="240" rx="10" fill="url(#bgDamp)"/>
  <rect x="20" y="20" width="360" height="200" rx="8" fill="#1c1917" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Bathroom Tile Lines (cracked & discolored) -->
  <line x1="20" y1="90" x2="380" y2="90" stroke="#292524" stroke-width="1.5"/>
  <line x1="20" y1="150" x2="380" y2="150" stroke="#292524" stroke-width="1.5"/>
  <line x1="140" y1="20" x2="140" y2="220" stroke="#292524" stroke-width="1.5"/>
  <line x1="260" y1="20" x2="260" y2="220" stroke="#292524" stroke-width="1.5"/>

  <!-- Seepage Water Stain Spreading on Wall -->
  <ellipse cx="200" cy="120" rx="120" ry="65" fill="url(#waterStain)"/>
  <ellipse cx="180" cy="130" rx="70" ry="40" fill="#0f172a" opacity="0.6"/>

  <!-- Corroded GI Pipe Section -->
  <!-- Horizontal Pipe -->
  <rect x="40" y="112" width="160" height="18" rx="2" fill="url(#rustPipe)"/>
  <!-- Rust & Corrosion Texture Flakes -->
  <circle cx="80" cy="118" r="4" fill="#b45309"/>
  <circle cx="110" cy="123" r="5" fill="#78350f"/>
  <circle cx="140" cy="117" r="3.5" fill="#d97706"/>
  <circle cx="170" cy="122" r="4.5" fill="#451a03"/>
  <circle cx="95" cy="120" r="3" fill="#92400e"/>

  <!-- Leaking Elbow Joint -->
  <rect x="195" y="108" width="26" height="26" rx="3" fill="#573a08" stroke="#78350f" stroke-width="2"/>
  <circle cx="208" cy="121" r="5" fill="#b45309"/>

  <!-- Vertical Pipe Running Down -->
  <rect x="199" y="130" width="18" height="75" rx="2" fill="url(#rustPipe)"/>
  <circle cx="208" cy="155" r="4" fill="#78350f"/>
  <circle cx="208" cy="180" r="4" fill="#d97706"/>

  <!-- Water Drops & Leakage (Active Dripping) -->
  <path d="M 215 125 C 215 125, 218 132, 218 135 C 218 138, 215 140, 212 140 C 209 140, 206 138, 206 135 C 206 132, 209 125, 209 125 Z" fill="#38bdf8"/>
  <path d="M 208 148 C 208 148, 211 154, 211 157 C 211 159, 209 161, 207 161 C 205 161, 203 159, 203 157 C 203 154, 205 148, 205 148 Z" fill="#0284c7"/>
  <path d="M 207 172 C 207 172, 210 178, 210 180 C 210 182, 208 184, 206 184 C 204 184, 202 182, 202 180 C 202 178, 204 172, 204 172 Z" fill="#38bdf8"/>

  <!-- Puddle at bottom -->
  <ellipse cx="207" cy="198" rx="25" ry="6" fill="#0284c7" opacity="0.8"/>

  <!-- Warning Badge -->
  <rect x="25" y="25" width="165" height="24" rx="4" fill="#991b1b"/>
  <text x="107" y="41" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🔴 RUSTED LEAKING GI PIPE</text>

  <text x="200" y="212" fill="#f87171" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Concealed Leakage • Severe Wall Dampness</text>
</svg>
