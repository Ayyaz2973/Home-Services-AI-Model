<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSafe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="mcbBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="rail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Clean Enclosure -->
  <rect width="400" height="240" rx="10" fill="url(#bgSafe)"/>
  <rect x="20" y="20" width="360" height="200" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>

  <!-- Slotted Trunking (Cable Ducts) -->
  <rect x="35" y="35" width="22" height="170" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="343" y="35" width="22" height="170" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Duct Slots -->
  <line x1="35" y1="50" x2="57" y2="50" stroke="#0f172a" stroke-width="2"/>
  <line x1="35" y1="70" x2="57" y2="70" stroke="#0f172a" stroke-width="2"/>
  <line x1="35" y1="90" x2="57" y2="90" stroke="#0f172a" stroke-width="2"/>
  <line x1="35" y1="110" x2="57" y2="110" stroke="#0f172a" stroke-width="2"/>
  <line x1="35" y1="130" x2="57" y2="130" stroke="#0f172a" stroke-width="2"/>
  <line x1="35" y1="150" x2="57" y2="150" stroke="#0f172a" stroke-width="2"/>
  <line x1="35" y1="170" x2="57" y2="170" stroke="#0f172a" stroke-width="2"/>
  <line x1="35" y1="190" x2="57" y2="190" stroke="#0f172a" stroke-width="2"/>

  <!-- DIN Rail -->
  <rect x="68" y="98" width="264" height="24" rx="2" fill="url(#rail)"/>
  <circle cx="80" cy="110" r="3" fill="#334155"/>
  <circle cx="320" cy="110" r="3" fill="#334155"/>

  <!-- Main 63A DP Breaker -->
  <rect x="75" y="62" width="48" height="96" rx="4" fill="url(#mcbBody)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="80" y="68" width="38" height="16" rx="2" fill="#0284c7"/>
  <text x="99" y="80" fill="#fff" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">63A MAIN</text>
  <rect x="84" y="96" width="12" height="26" rx="2" fill="#10b981"/>
  <rect x="102" y="96" width="12" height="26" rx="2" fill="#10b981"/>

  <!-- SP Schneider MCBs (Lighting, Power, AC 1, AC 2, Inverter) -->
  <!-- MCB 1 -->
  <rect x="130" y="62" width="34" height="96" rx="4" fill="url(#mcbBody)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="134" y="68" width="26" height="12" rx="1" fill="#475569"/>
  <text x="147" y="77" fill="#fff" font-family="Segoe UI, sans-serif" font-size="8" text-anchor="middle">10A</text>
  <rect x="141" y="96" width="12" height="26" rx="2" fill="#10b981"/>

  <!-- MCB 2 -->
  <rect x="168" y="62" width="34" height="96" rx="4" fill="url(#mcbBody)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="172" y="68" width="26" height="12" rx="1" fill="#475569"/>
  <text x="185" y="77" fill="#fff" font-family="Segoe UI, sans-serif" font-size="8" text-anchor="middle">16A</text>
  <rect x="179" y="96" width="12" height="26" rx="2" fill="#10b981"/>

  <!-- MCB 3 -->
  <rect x="206" y="62" width="34" height="96" rx="4" fill="url(#mcbBody)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="210" y="68" width="26" height="12" rx="1" fill="#475569"/>
  <text x="223" y="77" fill="#fff" font-family="Segoe UI, sans-serif" font-size="8" text-anchor="middle">20A</text>
  <rect x="217" y="96" width="12" height="26" rx="2" fill="#10b981"/>

  <!-- MCB 4 (Surge Protector) -->
  <rect x="244" y="62" width="44" height="96" rx="4" fill="#047857" stroke="#10b981" stroke-width="1.5"/>
  <text x="266" y="80" fill="#fff" font-family="Segoe UI, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">SPD 40kA</text>
  <circle cx="266" cy="110" r="7" fill="#10b981"/>
  <polygon points="266,105 270,111 267,111 267,115 264,115 264,111 261,111" fill="#fff"/>

  <!-- MCB 5 -->
  <rect x="292" y="62" width="34" height="96" rx="4" fill="url(#mcbBody)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="296" y="68" width="26" height="12" rx="1" fill="#475569"/>
  <text x="309" y="77" fill="#fff" font-family="Segoe UI, sans-serif" font-size="8" text-anchor="middle">32A</text>
  <rect x="303" y="96" width="12" height="26" rx="2" fill="#10b981"/>

  <!-- Clean Bundled Wiring (straight lines out of duct into breakers) -->
  <path d="M 57 70 L 75 70" stroke="#ef4444" stroke-width="3" fill="none"/>
  <path d="M 57 85 L 75 85" stroke="#0ea5e9" stroke-width="3" fill="none"/>
  <path d="M 57 140 L 75 140" stroke="#eab308" stroke-width="2.5" fill="none"/>
  
  <path d="M 147 62 L 147 48 L 343 48" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M 185 62 L 185 44 L 343 44" stroke="#eab308" stroke-width="2" fill="none"/>
  <path d="M 223 62 L 223 40 L 343 40" stroke="#0ea5e9" stroke-width="2" fill="none"/>

  <!-- Grounding Busbar at Bottom -->
  <rect x="80" y="180" width="240" height="8" rx="2" fill="#d97706"/>
  <line x1="100" y1="188" x2="100" y2="198" stroke="#22c55e" stroke-width="2.5"/>
  <line x1="140" y1="188" x2="140" y2="198" stroke="#22c55e" stroke-width="2.5"/>
  <line x1="180" y1="188" x2="180" y2="198" stroke="#22c55e" stroke-width="2.5"/>
  <line x1="220" y1="188" x2="220" y2="198" stroke="#22c55e" stroke-width="2.5"/>
  <line x1="260" y1="188" x2="260" y2="198" stroke="#22c55e" stroke-width="2.5"/>
  <line x1="300" y1="188" x2="300" y2="198" stroke="#22c55e" stroke-width="2.5"/>

  <!-- Status Badges -->
  <rect x="25" y="25" width="165" height="24" rx="4" fill="#047857"/>
  <text x="107" y="41" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🟢 SCHNEIDER REWIRE</text>

  <text x="200" y="212" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Earthing Verified • Color Trunking • Zero Tripping</text>
</svg>
